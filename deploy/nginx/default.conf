server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康檢查 endpoint（給 docker HEALTHCHECK / 外部 LB readiness probe）
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # /api/* 反代到 new-admin-rust-api（同源解 GAP-0e；strip /api/ 前綴）
    location /api/ {
        proxy_pass http://new-admin-rust-api:10001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # WebSocket 預備（未來如果加，現在不用會無害）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback（vue-router history mode 不要 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源 cache（30 天）
    location ~* \.(?:css|js|jpe?g|png|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip 壓縮
    gzip on;
    gzip_types text/plain text/html text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
}
