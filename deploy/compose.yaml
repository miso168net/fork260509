# ============================================================
# new-admin-root prod 主編排
# - dev override: compose.dev.yaml（T007 加）
# - 5 service: postgres / redis / migration（本 task 加）+
#              new-admin-rust-api（T009）+ new-admin-base-web（T011）
# - 對外 ports：僅 admin-base-web :8080（同源反代，FR-116）
# - 最低版本：Docker Compose v2.20+（用 service_completed_successfully condition）
# ============================================================

name: new-admin-root

services:
  postgres:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-new_admin}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      TZ: ${TZ:?must set TZ}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - admin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-new_admin}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?must set REDIS_PASSWORD}"
      - "--appendonly"
      - "yes"
    environment:
      TZ: ${TZ:?must set TZ}
    volumes:
      - redis-data:/data
    networks:
      - admin-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  migration:
    build:
      context: ../admin-api
      dockerfile: Dockerfile
      target: build           # 從 admin-api Dockerfile build stage 拿 cargo migration binary
    image: new-admin-rust-api-build:latest    # share build cache with admin-rust-api（T009 用同 image tag）
    command: ["cargo", "run", "-p", "migration", "--", "up"]
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-new_admin}
      TZ: ${TZ:?must set TZ}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - admin-net
    restart: "no"             # init container：跑完 exit 0 後不重啟

  new-admin-rust-api:
    build:
      context: ../admin-api
      dockerfile: Dockerfile
    image: new-admin-rust-api:latest    # 與 migration 的 build stage 共享 BuildKit cache（multi-stage layer dedupe）
    restart: unless-stopped
    environment:
      # admin-api 用 APP_ prefix + `_` separator 讀 env override（per server/config/src/env_config.rs）
      # 1-I4 fix（F7-T010 dynamic acceptance 發現）：前一版全部缺 APP_ → admin-api 退回 application.yaml 預設（pgbouncer:6432）→ restart loop
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-new_admin}
      APP_DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      APP_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_JWT_JWT_SECRET: ${JWT_SECRET:?must set JWT_SECRET}
      APP_JWT_ISSUER: ${JWT_ISSUER:-https://github.com/your-org/new-admin}
      APP_JWT_EXPIRE: ${JWT_EXPIRE:-7200}
      # 1-I2 fix：refresh_token 過期時間（feature 4 引入），原 .env.example 有定義但未 wire 進 compose
      APP_JWT_REFRESH_TOKEN_EXPIRE: ${APP_JWT_REFRESH_TOKEN_EXPIRE:-1209600}
      APP_SERVER_HOST: 0.0.0.0
      APP_SERVER_PORT: 10001
      # RUST_LOG 與 TZ 維持原名（tracing crate / system timezone，非 admin-api config crate）
      RUST_LOG: ${RUST_LOG:-info}
      TZ: ${TZ:?must set TZ}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - admin-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:10001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 不設 ports：prod 走同源反代（FR-116）；dev override 由 T010 加 :10001

  new-admin-base-web:
    build:
      context: ..                        # outer 倉根（admin-web/Dockerfile 在 admin-web/，feature 7 提供）
      dockerfile: admin-web/Dockerfile
      args:
        VITE_BASE_URL: /
        VITE_SERVICE_BASE_URL: /api
        VITE_APP_TITLE: ${VITE_APP_TITLE:-NewAdmin}
        VITE_AUTH_ROUTE_MODE: ${VITE_AUTH_ROUTE_MODE:-static}
        VITE_STATIC_SUPER_ROLE: ${VITE_STATIC_SUPER_ROLE:-R_SUPER}
    image: new-admin-base-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"           # 唯一對外 port（同源反代入口，FR-114 + FR-116）
    depends_on:
      new-admin-rust-api:
        condition: service_healthy
    networks:
      - admin-net
    # nginx HEALTHCHECK 由 admin-web/Dockerfile 自帶（feature 7 處理）；compose 不重複設

networks:
  admin-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
